<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pitchGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with stadium dark backdrop -->
  <rect width="512" height="512" rx="128" fill="#090d0b" />
  <circle cx="256" cy="256" r="210" fill="#0c1612" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />
  <!-- Pitch outline -->
  <rect x="116" y="116" width="280" height="280" rx="32" fill="none" stroke="#10b981" stroke-width="10" stroke-opacity="0.6" />
  <line x1="116" y1="256" x2="396" y2="256" stroke="#10b981" stroke-width="8" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="48" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.6" />
  <!-- Football trophy & ball emblem -->
  <circle cx="256" cy="256" r="26" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
